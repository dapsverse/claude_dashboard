name: release
# Publishing happens here and nowhere else: provenance ties the published tarball to this workflow
# run and this commit, which a laptop publish cannot do. Create a GitHub release to trigger it.
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write        # required for npm provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13'
          registry-url: 'https://registry.npmjs.org'
      # A release tag with an unbumped package.json either republishes the previous version under a
      # new tag or dies on EPUBLISHCONFLICT — and either way that's after both suites have already
      # run. Catch it before spending any of that time.
      - name: Verify package.json version matches the release tag
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          EXPECTED="${TAG_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$EXPECTED" != "$PKG_VERSION" ]; then
            echo "::error::release tag $TAG_NAME expects version $EXPECTED but package.json has $PKG_VERSION"
            exit 1
          fi
          echo "package.json version $PKG_VERSION matches release tag $TAG_NAME"
      - run: npm ci
      # Nothing is published that has not passed both suites and produced a real bundle first.
      - run: npm test
      - run: npm run test:ui
      - run: npm run build:ui
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
